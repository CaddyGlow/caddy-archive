name: archive-rs Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    working-directory: archive-rs
jobs:
  foundation:
    name: Bootstrap archive core and filesystem crates
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          path: archive-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.CABINET_REPOSITORY || format('{0}/ms-cabinet', github.repository_owner) }}
          ref: ${{ vars.CABINET_REF || 'main' }}
          path: cabinet
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MKISO_RS_REPOSITORY || format('{0}/mkiso-rs', github.repository_owner) }}
          ref: ${{ vars.MKISO_RS_REF || 'main' }}
          path: mkiso-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.WIM_RS_REPOSITORY || format('{0}/wim-rs', github.repository_owner) }}
          ref: ${{ vars.WIM_RS_REF || 'main' }}
          path: wim-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MS_COMPRESS_REPOSITORY || format('{0}/ms-compress', github.repository_owner) }}
          ref: ${{ vars.MS_COMPRESS_REF || 'main' }}
          path: ms-compress
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MS_PACKAGE_REPOSITORY || format('{0}/ms-package', github.repository_owner) }}
          ref: ${{ vars.MS_PACKAGE_REF || 'main' }}
          path: ms-package
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test -p caddy-archive-core -p caddy-archive-fs --all-features --locked
      - run: cargo clippy -p caddy-archive-core -p caddy-archive-fs --all-targets --all-features --locked -- -D warnings
      - run: cargo package -p caddy-archive-core -p caddy-archive-fs --locked
      - run: python3 scripts/publish-crates.py caddy-archive-core caddy-archive-fs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  validate:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  package:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: archive-rs
    steps:
      - uses: actions/checkout@v7
        with:
          path: archive-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.CABINET_REPOSITORY || format('{0}/ms-cabinet', github.repository_owner) }}
          ref: ${{ vars.CABINET_REF }}
          path: cabinet
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MKISO_RS_REPOSITORY || format('{0}/mkiso-rs', github.repository_owner) }}
          ref: ${{ vars.MKISO_RS_REF }}
          path: mkiso-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.WIM_RS_REPOSITORY || format('{0}/wim-rs', github.repository_owner) }}
          ref: ${{ vars.WIM_RS_REF }}
          path: wim-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MS_COMPRESS_REPOSITORY || format('{0}/ms-compress', github.repository_owner) }}
          ref: ${{ vars.MS_COMPRESS_REF }}
          path: ms-compress
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MS_PACKAGE_REPOSITORY || format('{0}/ms-package', github.repository_owner) }}
          ref: ${{ vars.MS_PACKAGE_REF }}
          path: ms-package
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: validation
          workspaces: |
            archive-rs -> target
            archive-rs/fuzz -> target
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as manifest:
              data = tomllib.load(manifest)
          version = data.get("package", data.get("workspace", {}).get("package", {}))["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Tag must match package version v{version}")
          PY
      - name: Package sources and sibling dependencies
        working-directory: .
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          directory="archive-rs-${RELEASE_TAG}-source"
          mkdir -p "dist/$directory"
          for repo in archive-rs cabinet mkiso-rs wim-rs ms-compress ms-package; do
            mkdir -p "dist/$directory/$repo"
            git -C "$repo" log -1 --format="$repo %H" >> "dist/$directory/COMMITS"
            git -C "$repo" archive --format=tar --output="$RUNNER_TEMP/$repo.tar" HEAD
            tar -xf "$RUNNER_TEMP/$repo.tar" -C "dist/$directory/$repo"
          done
          tar -czf "dist/$directory.tar.gz" -C dist "$directory"
      - name: Build and verify crates.io packages
        run: cargo package --workspace --locked
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            dist/*-source.tar.gz
            archive-rs/target/package/*.crate
          if-no-files-found: error

  binaries:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: archive-rs
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: archive-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.CABINET_REPOSITORY || format('{0}/ms-cabinet', github.repository_owner) }}
          ref: ${{ vars.CABINET_REF }}
          path: cabinet
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MKISO_RS_REPOSITORY || format('{0}/mkiso-rs', github.repository_owner) }}
          ref: ${{ vars.MKISO_RS_REF }}
          path: mkiso-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.WIM_RS_REPOSITORY || format('{0}/wim-rs', github.repository_owner) }}
          ref: ${{ vars.WIM_RS_REF }}
          path: wim-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MS_COMPRESS_REPOSITORY || format('{0}/ms-compress', github.repository_owner) }}
          ref: ${{ vars.MS_COMPRESS_REF }}
          path: ms-compress
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MS_PACKAGE_REPOSITORY || format('{0}/ms-package', github.repository_owner) }}
          ref: ${{ vars.MS_PACKAGE_REF }}
          path: ms-package
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          workspaces: |
            archive-rs -> target
            archive-rs/fuzz -> target
      - name: Build release outputs
        run: cargo build --release -p caddy-archive-cli --features progress,parallel --bin arc --target "$TARGET" --locked
      - name: Test release profile
        run: cargo test --release -p caddy-archive-cli --features progress,parallel --target "$TARGET" --locked
      - name: Package compiled outputs and license notices
        env:
          OUTPUT_REPOSITORY: archive-rs
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, tarfile
          repo = os.environ["OUTPUT_REPOSITORY"]
          target = os.environ["TARGET"]
          directory = f"{repo}-{os.environ['RELEASE_TAG']}-{target}"
          output = pathlib.Path("dist") / directory
          output.mkdir(parents=True)
          build = pathlib.Path("target") / target / "release"
          files = [name + (".exe" if "windows" in target else "") for name in ['arc']]
          for name in files:
              shutil.copy2(build / name, output / name)
          shutil.copy2("README.md", output / "README.md")
          for sibling in ['archive-rs', 'cabinet', 'mkiso-rs', 'wim-rs', 'ms-compress', 'ms-package']:
              base = pathlib.Path("..") / sibling
              for path in base.rglob("*"):
                  if any(part in {".git", "target", "dist"} for part in path.relative_to(base).parts):
                      continue
                  if path.is_file() and path.name.upper().startswith(("LICENSE", "NOTICE", "COPYING")):
                      dest = output / "licenses" / sibling / path.relative_to(base)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(path, dest)
          with tarfile.open(f"dist/{directory}.tar.gz", "w:gz") as archive:
              archive.add(output, arcname=directory)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: archive-rs/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: [package, binaries]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          path: archive-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.CABINET_REPOSITORY || format('{0}/ms-cabinet', github.repository_owner) }}
          ref: ${{ vars.CABINET_REF || 'main' }}
          path: cabinet
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MKISO_RS_REPOSITORY || format('{0}/mkiso-rs', github.repository_owner) }}
          ref: ${{ vars.MKISO_RS_REF || 'main' }}
          path: mkiso-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.WIM_RS_REPOSITORY || format('{0}/wim-rs', github.repository_owner) }}
          ref: ${{ vars.WIM_RS_REF || 'main' }}
          path: wim-rs
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MS_COMPRESS_REPOSITORY || format('{0}/ms-compress', github.repository_owner) }}
          ref: ${{ vars.MS_COMPRESS_REF || 'main' }}
          path: ms-compress
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MS_PACKAGE_REPOSITORY || format('{0}/ms-package', github.repository_owner) }}
          ref: ${{ vars.MS_PACKAGE_REF || 'main' }}
          path: ms-package
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: python3 scripts/publish-crates.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    needs: [package, binaries, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish package, binaries, and checksums
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(*.crate *.tar.gz)
          test "${#files[@]}" -gt 0
          sha256sum "${files[@]}" > SHA256SUMS
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes             "${flags[@]}" "${files[@]}" SHA256SUMS
