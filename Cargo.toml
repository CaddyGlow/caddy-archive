[workspace]
members = ["crates/archive-core", "crates/archive-fs", "crates/archive-cli", "crates/archive-wasm"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/CaddyGlow/caddy-archive"

[workspace.dependencies]
libmkiso = { version = "0.1.4", default-features = false }
anyhow = "1.0"
clap = "4.5"
serde_json = "1.0"
libc = "0.2"
tempfile = "3.23"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
strip = true

[workspace.lints.clippy]
# Preserve established iterator/remainder handling during the Rust 1.99 upgrade.
chunks_exact_to_as_chunks = "allow"
