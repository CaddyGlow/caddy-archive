name: archive-rs Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    working-directory: archive-rs
jobs:
  foundation:
    name: Bootstrap archive core and filesystem crates
    needs: [validate, binaries]
    if: ${{ always() && !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.validate.result == 'success' && needs.binaries.result == 'success')) }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          path: archive-rs
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test -p caddy-archive-core -p caddy-archive-fs --all-features --locked
      - run: cargo clippy -p caddy-archive-core -p caddy-archive-fs --all-targets --all-features --locked -- -D warnings
      - name: Check tag matches package version before publication
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as manifest:
              data = tomllib.load(manifest)
          version = data.get("package", data.get("workspace", {}).get("package", {}))["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Tag must match package version v{version}")
          PY
      - run: python3 scripts/publish-crates.py caddy-archive-core caddy-archive-fs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  validate:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  package:
    if: github.event_name == 'push'
    needs: foundation
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: archive-rs
    steps:
      - uses: actions/checkout@v7
        with:
          path: archive-rs
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: validation
          workspaces: |
            archive-rs -> target
            archive-rs/fuzz -> target
      - name: Package standalone sources and registry lockfile
        working-directory: .
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          directory="archive-rs-${RELEASE_TAG}-source"
          mkdir -p "dist/$directory"
          mkdir -p "dist/$directory/archive-rs"
          git -C archive-rs log -1 --format="archive-rs %H" > "dist/$directory/COMMITS"
          git -C archive-rs archive --format=tar --output="$RUNNER_TEMP/archive-rs.tar" HEAD
          tar -xf "$RUNNER_TEMP/archive-rs.tar" -C "dist/$directory/archive-rs"
          tar -czf "dist/$directory.tar.gz" -C dist "$directory"
      - name: Verify extracted standalone source archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          destination=$(mktemp -d)
          trap 'rm -rf "$destination"' EXIT
          tar -xzf "../dist/archive-rs-${RELEASE_TAG}-source.tar.gz" -C "$destination"
          cargo test --manifest-path "$destination/archive-rs-${RELEASE_TAG}-source/archive-rs/Cargo.toml" --workspace --all-features --locked
      - name: Build and verify crates.io packages
        run: cargo package --workspace --locked
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            dist/*-source.tar.gz
            archive-rs/target/package/*.crate
          if-no-files-found: error

  binaries:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: archive-rs
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: archive-rs
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          workspaces: |
            archive-rs -> target
            archive-rs/fuzz -> target
      - name: Build release outputs
        run: cargo build --release -p caddy-archive-cli --features progress,parallel --bin arc --target "$TARGET" --locked
      - name: Test release profile
        run: cargo test --release -p caddy-archive-cli --features progress,parallel --target "$TARGET" --locked
      - name: Package compiled outputs and license notices
        env:
          OUTPUT_REPOSITORY: archive-rs
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, tarfile
          repo = os.environ["OUTPUT_REPOSITORY"]
          target = os.environ["TARGET"]
          directory = f"{repo}-{os.environ['RELEASE_TAG']}-{target}"
          output = pathlib.Path("dist") / directory
          output.mkdir(parents=True)
          build = pathlib.Path("target") / target / "release"
          files = [name + (".exe" if "windows" in target else "") for name in ['arc']]
          for name in files:
              shutil.copy2(build / name, output / name)
          shutil.copy2("README.md", output / "README.md")
          import json, subprocess
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          (output / "COMMITS").write_text(f"archive-rs {sha}\n")
          shutil.copy2("Cargo.lock", output / "Cargo.lock")
          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--locked", "--all-features", "--format-version", "1",
              "--filter-platform", target,
          ], text=True))
          packages = {package["id"]: package for package in metadata["packages"]}
          nodes = {node["id"]: node for node in metadata["resolve"]["nodes"]}
          root = next(package["id"] for package in metadata["packages"]
                      if package["name"] == "caddy-archive-cli")
          pending = [root]
          selected = set()
          while pending:
              package_id = pending.pop()
              if package_id in selected:
                  continue
              selected.add(package_id)
              pending.extend(dep["pkg"] for dep in nodes[package_id]["deps"]
                             if any(kind["kind"] != "dev" for kind in dep["dep_kinds"]))
          provenance = []
          license_roots = [("archive-rs", pathlib.Path.cwd(), None)]
          for package_id in sorted(selected):
              package = packages[package_id]
              provenance.append({key: package.get(key) for key in
                                 ["name", "version", "source", "license", "repository"]})
              if package_id in metadata["workspace_members"]:
                  continue
              if not (package["source"] or "").startswith("registry+"):
                  raise SystemExit(f"Non-registry release dependency: {package_id}")
              base = pathlib.Path(package["manifest_path"]).parent
              label = f"{package['name']}-{package['version']}"
              license_roots.append((label, base, package.get("license_file")))
          for label, base, license_file in license_roots:
              paths = set()
              for path in base.rglob("*"):
                  if any(part in {".git", "target", "dist"} for part in path.relative_to(base).parts):
                      continue
                  if path.is_file() and any(word in path.name.upper() for word in ["LICENSE", "NOTICE", "COPYING"]):
                      paths.add(path)
              if license_file:
                  path = pathlib.Path(license_file)
                  paths.add(path if path.is_absolute() else base / path)
              for path in sorted(paths):
                  destination = output / "licenses" / label / path.relative_to(base)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, destination)
          (output / "DEPENDENCIES.json").write_text(json.dumps(provenance, indent=2) + "\n")
          with tarfile.open(f"dist/{directory}.tar.gz", "w:gz") as archive:
              archive.add(output, arcname=directory)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: archive-rs/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: [package, binaries]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          path: archive-rs
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: python3 scripts/publish-crates.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    needs: [package, binaries, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish package, binaries, and checksums
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYFLAT'
          import pathlib, shutil
          root = pathlib.Path('.')
          for path in sorted(root.rglob('*')):
              if path.is_file() and (path.name.endswith('.crate') or path.name.endswith('.tar.gz')) and path.parent != root:
                  destination = root / path.name
                  if destination.exists():
                      raise SystemExit(f'Duplicate release asset: {path.name}')
                  shutil.move(path, destination)
          PYFLAT
          shopt -s nullglob
          files=(*.crate *.tar.gz)
          test "${#files[@]}" -gt 0
          sha256sum "${files[@]}" > SHA256SUMS
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes             "${flags[@]}" "${files[@]}" SHA256SUMS
