name: archive-rs CI
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-checks-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
defaults:
  run:
    working-directory: archive-rs
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: archive-rs
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: validation
          workspaces: |
            archive-rs -> target
            archive-rs/fuzz -> target
      - run: python3 scripts/check-release-dependencies.py
      - run: python3 -m unittest discover -s scripts/tests
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path fuzz/Cargo.toml --locked

  archive-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: archive-rs
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: validation
          workspaces: |
            archive-rs -> target
            archive-rs/fuzz -> target
      - name: Check independent archive CLI features
        shell: bash
        run: |
          for ARCHIVE_FEATURES in none progress parallel both; do
            args=(--no-default-features)
            case "$ARCHIVE_FEATURES" in
              progress|parallel) args+=(--features "$ARCHIVE_FEATURES") ;;
              both) args+=(--features "progress,parallel") ;;
            esac
            cargo test -p caddy-archive-cli --locked "${args[@]}"
            cargo clippy -p caddy-archive-cli --all-targets --locked "${args[@]}" -- -D warnings
          done

  archive-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: archive-rs
      - name: Resolve qualified package authoring test sources
        id: package_source
        run: python3 scripts/check-release-dependencies.py --source-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: CaddyGlow/ms-package
          ref: ${{ steps.package_source.outputs.commit }}
          path: ms-package
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: validation
          workspaces: |
            archive-rs -> target
            archive-rs/fuzz -> target
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: cargo build --release -p caddy-archive-wasm --features packages,crypto,sevenz,bzip2,brotli --target wasm32-unknown-unknown --locked
      - name: Generate browser bindings and load preserved native parity fixtures
        shell: bash
        run: |
          wasm-bindgen target/wasm32-unknown-unknown/release/archive_wasm.wasm --target web --out-dir /tmp/archive-browser/pkg
          (cd crates/archive-wasm/tests/fixtures/package && sha256sum --check SHA256SUMS)
          (cd crates/archive-wasm/tests/fixtures/package/media-migration && sha256sum --check SHA256SUMS)
          mkdir -p /tmp/archive-browser/pkg/fixtures
          cp -R crates/archive-wasm/tests/fixtures/package/. /tmp/archive-browser/pkg/fixtures/
      - name: Run real browser Worker regression checks
        shell: bash
        env:
          ARCHIVE_BROWSER: google-chrome
        run: |
          node scripts/archive-browser-server.mjs &
          archive_server_pid=$!
          trap 'kill "$archive_server_pid"' EXIT
          node scripts/check-archive-browser.mjs
      - name: Run published-package authoring and downstream reader Worker checks
        env:
          ARCHIVE_BROWSER: google-chrome
        run: bash scripts/check-archive-authoring-browser.sh ../ms-package/tests/browser-authoring /tmp/archive-browser/pkg

  windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: archive-rs
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: validation
          workspaces: |
            archive-rs -> target
            archive-rs/fuzz -> target
      - run: cargo test --workspace --all-features --locked
