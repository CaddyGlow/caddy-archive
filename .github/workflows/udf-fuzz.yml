name: UDF Bounded Fuzz
on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 2'
permissions:
  contents: read
defaults:
  run:
    working-directory: archive-rs

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: archive-rs
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: |
            archive-rs -> target
            archive-rs/fuzz -> target
      - run: sudo apt-get update && sudo apt-get install -y binutils-dev libunwind-dev liblzma-dev build-essential
      - run: cargo install honggfuzz --version 0.5.62 --locked
      - run: bash scripts/udf-fuzz-smoke.sh
        env:
          UDF_FUZZ_ITERATIONS: '10000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: udf-fuzz-evidence
          path: archive-rs/target/udf-fuzz
          retention-days: 30
