[package]
name = "caddy-archive-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser WebAssembly bindings for caddy-archive"

[lib]
name = "archive_wasm"
crate-type = ["cdylib", "rlib"]

[features]
default = []
packages = ["dep:ms-package", "dep:package-core"]
crypto = ["archive-core/crypto", "dep:zeroize"]
sevenz = ["archive-core/sevenz"]
bzip2 = ["archive-core/bzip2"]
brotli = ["archive-core/brotli"]

[dependencies]
package-core = { package = "caddy-archive-core", version = "=0.2.1", default-features = false, optional = true }
archive-core = { version = "0.3.3", package = "caddy-archive-core", path = "../archive-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", optional = true }
ms-package = { version = "0.2.2", optional = true }

[lints]
workspace = true
