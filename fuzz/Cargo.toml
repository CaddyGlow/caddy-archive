[package]
name = "archive-fuzz"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
honggfuzz = "0.5"
cabinet = { version = "0.1.0", package = "ms-cabinet", path = "../../cabinet" }
archive-core = { version = "0.1.0", package = "caddy-archive-core", path = "../crates/archive-core", features = ["sevenz", "crypto", "wim", "udf", "bzip2", "brotli"] }
ms-package = { version = "0.1.0", path = "../../ms-package" }
libmkiso = { version = "0.1.0", path = "../../mkiso-rs", default-features = false, features = ["native-writer"] }
tempfile = "3"
sha2 = "0.10"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
debug = 1
overflow-checks = true

[lints.clippy]
# Preserve established iterator/remainder handling during the Rust 1.99 upgrade.
chunks_exact_to_as_chunks = "allow"
