[package]
name = "caddy-archive-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable archive parsing, extraction and integrity validation"

[lib]
name = "archive_core"

[features]
default = ["zip", "tar", "gzip", "cab", "iso", "xz", "streams"]
streams = []
bzip2 = ["streams", "tar", "dep:bzip2"]
brotli = ["streams", "tar", "dep:brotli"]
xz = ["tar", "dep:crc64fast", "dep:sha2"]
sevenz = []
iso = ["dep:libmkiso"]
udf = ["dep:libmkiso"]
wim = ["dep:wim-format"]
zip = ["dep:zip"]
tar = ["dep:tar"]
gzip = ["tar"]
cab = ["dep:cabinet"]
parallel = []
crypto = ["dep:aes", "dep:ctr", "dep:pbkdf2", "dep:hmac", "dep:sha1", "dep:subtle", "dep:zeroize", "dep:sha2", "dep:cbc"]

[dependencies]
bzip2 = { version = "0.6.1", optional = true }
brotli = { version = "8", optional = true }
ms-compress = { version = "0.1.0", path = "../../../ms-compress", default-features = false, features = ["std"] }
crc64fast = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
libmkiso = { workspace = true, optional = true, default-features = false }
cabinet = { version = "0.1.0", package = "ms-cabinet", path = "../../../cabinet", optional = true }
zip = { version = "4", default-features = false, optional = true }
tar = { version = "0.4", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
aes = { version = "0.8", features = ["zeroize"], optional = true }
cbc = { version = "0.1", optional = true }
ctr = { version = "0.9", optional = true }
pbkdf2 = { version = "0.12", optional = true }
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }
subtle = { version = "2", optional = true }
zeroize = { version = "1", optional = true }
wim-format = { version = "0.1.0", path = "../../../wim-rs/crates/wim-format", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
tempfile.workspace = true
libmkiso = { workspace = true, features = ["native-writer"] }

[lints]
workspace = true
